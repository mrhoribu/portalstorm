<!DOCTYPE html>
<!-- Source for docs/images/og-banner.png. Screenshot at exactly 1200x630. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,600,700" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f4f4f4 url(../docs/assets/css/images/bg.png);font-family:'Open Sans',sans-serif;color:#555;position:relative}
.bar{position:absolute;left:0;right:0;top:0;height:18px;background:#282828}
.foot{position:absolute;left:0;right:0;bottom:0;height:86px;background:#282828;display:flex;align-items:center;justify-content:center;gap:26px}
.foot img{width:58px;height:58px;object-fit:contain}
.main{position:absolute;top:18px;bottom:86px;left:0;right:0;display:flex;align-items:center;gap:40px;padding:0 70px}
.logo{width:420px;flex-shrink:0}
h1{font-weight:700;font-size:74px;line-height:1.05;color:#444;letter-spacing:-.01em}
p{font-weight:300;font-size:28px;line-height:1.4;color:#777;margin:18px 0 26px}
.url{display:inline-block;font-weight:600;font-size:26px;color:#fff;padding:10px 26px;border-radius:8px;background:#43B3E0 linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.2))}
</style></head><body>
<div class="bar"></div>
<div class="main">
  <img class="logo" src="../docs/images/storm.png" alt="">
  <div>
    <h1>Portal Storm Gaming</h1>
    <p>A casual group of gamers out to explore, conquer, and just outright have fun together.</p>
    <span class="url">portalstorm.net</span>
  </div>
</div>
<div class="foot">
  <img src="../docs/images/starcitizen.png" alt=""><img src="../docs/images/diablo3.png" alt=""><img src="../docs/images/ark2.png" alt=""><img src="../docs/images/smite.png" alt=""><img src="../docs/images/rust.png" alt=""><img src="../docs/images/buadren-ac.png" alt="">
</div>
</body></html>
